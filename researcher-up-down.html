<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Decision Lab — 研究者用</title><style>body{font:16px system-ui;background:#f3f6fa;color:#1b2b3b;margin:0}main{max-width:700px;margin:24px auto;background:white;padding:24px}label{display:block;margin:15px 0 5px}input,button{font:inherit;padding:12px;width:100%;box-sizing:border-box}button{margin-top:16px;background:#176c91;color:white;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}p{line-height:1.6}</style><main><h1>研究者用管理画面：追加実験</h1><p>許可された研究者アカウントでログインしてください。学生はログイン不要です。</p><form id="login"><label for="email">メールアドレス</label><input id="email" type="email" required autocomplete="username"><label for="password">パスワード</label><input id="password" type="password" required autocomplete="current-password"><button>ログイン</button></form><p id="status" role="status"></p><section id="protected" hidden><h2>回答収集状況</h2><pre id="summary"></pre><button id="export">回答データをJSONで保存</button><button id="logout">ログアウト</button></section><p><a href="./up-down.html">学生用の実験画面へ</a></p></main><script>
const API='https://plirzczxdhddfcxldnxj.supabase.co',KEY='sb_publishable_NCH7QuER6v_83QHr8RvVkA_9U2oprUz';let token=null,rows=null;const $=id=>document.getElementById(id);function clear(){token=null;rows=null;$('protected').hidden=true;$('summary').textContent='';$('login').hidden=false;$('password').value=''}
$('login').onsubmit=async e=>{e.preventDefault();const password=$('password').value;clear();$('status').textContent='確認中…';try{const auth=await fetch(API+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password})});const a=await auth.json();$('password').value='';if(!auth.ok)throw Error('メールアドレスとパスワードを確認してください。');token=a.access_token;const response=await fetch(API+'/rest/v1/rpc/research_decision_runs_up_down',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}'});if(!response.ok)throw Error('このアカウントには研究者権限が設定されていません。');rows=await response.json();$('login').hidden=true;$('protected').hidden=false;$('summary').textContent='実験数：'+rows.length+'\n34回答完了：'+rows.filter(r=>r.rows.length===34).length+'\n回答総数：'+rows.reduce((n,r)=>n+r.rows.length,0)+'\n\n'+rows.map(r=>(r.student_code||'学籍番号未登録')+' ／ 条件 '+r.condition+' ／ '+r.rows.length+'/34回答').join('\n');$('status').textContent='ログイン済み';}catch(err){clear();$('status').textContent=err.message}};
$('logout').onclick=async()=>{const previous=token;clear();$('status').textContent='ログアウトしました。';if(previous)await fetch(API+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+previous}}).catch(()=>{})};$('export').onclick=()=>{if(!token||!rows)return;const url=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='decision-lab-up-down-responses.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>

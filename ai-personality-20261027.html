<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI人格実験</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:auto;padding:18px;color:#152238}h1{font-size:1.5rem}section{border:1px solid #cbd5e1;border-radius:12px;padding:16px;margin:14px 0}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}input,select,textarea{width:100%;border:1px solid #94a3b8;border-radius:7px}textarea{height:100px}button{background:#155e75;color:white;border:0;border-radius:7px;margin:6px 0;cursor:pointer}button:disabled{opacity:.5}.sub{background:#e2e8f0;color:#152238}.small{font-size:.9rem;color:#475569}pre{white-space:pre-wrap;background:#f1f5f9;padding:12px;border-radius:8px}#msg{font-weight:bold}</style><h1>AI人格実験｜回答登録</h1><p>ChatGPTなどのAIへの質問は「コピー」で貼り付けます。各試行では必ず新しいチャットを開いてください。AIのAPI接続は不要です。</p><section><label>授業<select id="cl"><option value="FUKUI20261027">福井大学 10/27</option><option value="OU2026">放送大学</option></select></label><label>匿名ID（同じ授業中は固定）<input id="pid" placeholder="例: G2P03" maxlength="24"></label><label>班番号<input id="grp" placeholder="例: 2" maxlength="12"></label><label>AIモデル<input id="model" placeholder="例: Claude Sonnet / GPT-6" maxlength="80"></label><label>人格条件<select id="cond"><option value="A">A 指定なし</option><option value="B">B 外向的</option><option value="C">C 内向的</option></select></label><label>試行<select id="trial"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></section><section><h2>① 指示文をAIへコピー</h2><pre id="persona"></pre><button onclick="copy('persona')">人格指示をコピー</button><h2>② 共通10問をコピー</h2><pre id="questions"></pre><button onclick="copy('questions')">質問をコピー</button><label>AIの10個の回答（カンマ区切り）<textarea id="answers" placeholder="4,3,3,3,3,2,4,4,3,2"></textarea></label><h2>③ 発話課題をコピー</h2><pre id="scene"></pre><button onclick="copy('scene')">発話課題をコピー</button><label>AIの発話を貼り付け<textarea id="statement" placeholder="AIが書いた文章をそのまま貼る"></textarea></label><button id="send" onclick="submitTrial()">この試行をサーバーに登録</button><p id="msg" aria-live="polite"></p><p id="draftstatus" class="small">入力内容はこの端末にも自動保存されます。</p></section><section><h2>人間によるAI発話評価</h2><p class="small">他のAIの文章を、人格条件を知らずに1～5点で評価します。授業の指示が出てから実施してください。</p><button class="sub" onclick="loadStimuli()">評価する文章を表示</button><div id="stimuli"></div></section><p class="small">実名・学籍番号は記入しないでください。授業用の匿名IDのみ使います。</p><script>
const $=id=>document.getElementById(id);
const personas={A:"これから質問紙に回答してください。特定の人物像は指定しません。あなたに最も当てはまるように回答し、数字のみを出力してください。",B:"あなたは非常に外向的な人物です。人と交流することが好きで、初対面の相手にも積極的に話しかけ、大勢の集まりを楽しみます。この人物として一貫して回答してください。",C:"あなたは非常に内向的な人物です。一人で過ごす時間を好み、初対面の相手との会話に慎重で、大勢の集まりより少人数の交流を好みます。この人物として一貫して回答してください。"};
$('questions').textContent="次の10項目について1=全く当てはまらない、2=あまり当てはまらない、3=どちらともいえない、4=やや当てはまる、5=非常に当てはまるで答えてください。回答は10個の数字だけをカンマ区切りで出力してください。\nQ1 初対面の人と話すのが好きだ。\nQ2 大勢の人が集まる場所を楽しめる。\nQ3 自分から人に話しかけることが多い。\nQ4 一人で静かに過ごす方が好きだ。\nQ5 人前で自分の意見を積極的に述べる。\nQ6 知らない人と話すと疲れやすい。\nQ7 新しい交友関係を作ることが好きだ。\nQ8 集団活動では聞き役になることが多い。\nQ9 人と交流すると元気になる。\nQ10 大人数の会合をなるべく避けたい。";
$('scene').textContent="あなたは大学1年生です。知らない学生ばかりが集まる交流会に誘われました。あなたならどうしますか。気持ちと行動を100字程度で答えてください。人格条件名や心理尺度には言及しないでください。";
function update(){ $('persona').textContent=personas[$('cond').value]+'\nこの設定で、次の質問紙と発話課題に答えてください。';}
$('cond').addEventListener('change',update);update();
function copy(id){navigator.clipboard.writeText($(id).textContent).then(()=>alert('コピーしました')).catch(()=>alert('コピーできません。文章を長押ししてコピーしてください。'))}
async function post(data){let r=await fetch("https://plirzczxdhddfcxldnxj.supabase.co/functions/v1/ai-personality-classroom",{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});let v=await r.json();if(!r.ok)throw Error(v.error||'送信に失敗');return v;}
async function submitTrial(){try{let a=$('answers').value.trim().split(/[^0-9]+/).filter(Boolean).map(Number);if(a.length!==10||a.some(x=>!Number.isInteger(x)||x<1||x>5))throw Error('数字が'+a.length+'個あります。必要なのは10個です。AIの回答を確認してください');let b={kind:'trial',class_code:$('cl').value,participant_code:$('pid').value.trim(),group_code:$('grp').value.trim(),model_name:$('model').value.trim(),condition:$('cond').value,trial_number:Number($('trial').value),answers:a,statement:$('statement').value.trim()};localStorage.setItem('ai-personality-pending',JSON.stringify(b));let r=await post(b);localStorage.removeItem('ai-personality-pending');$('msg').textContent='保存成功：試行'+b.trial_number+'、外向性平均 '+r.score.toFixed(2)+'。次は新しいチャットで試行'+Math.min(5,b.trial_number+1);$('trial').value=String(Math.min(5,b.trial_number+1));$('answers').value='';$('statement').value='';}catch(e){$('msg').textContent='端末には保管済み・サーバー未保存：'+e.message+'。通信復帰時に再送します。'}}
async function loadStimuli(){let r=await fetch("https://plirzczxdhddfcxldnxj.supabase.co/functions/v1/ai-personality-classroom"+'?stimuli=1&class='+encodeURIComponent($('cl').value));let data=await r.json();$('stimuli').replaceChildren();if(!r.ok||!data.stimuli?.length){$('stimuli').textContent='まだ評価用文章が揃っていません。各条件の試行登録後にお試しください。';return}for(const s of data.stimuli){let div=document.createElement('section');let head=document.createElement('h3');head.textContent=s.id;let p=document.createElement('p');p.textContent=s.statement;let sel=document.createElement('select');for(let n=1;n<=5;n++){let o=document.createElement('option');o.value=n;o.textContent=n+'点';sel.append(o)}let btn=document.createElement('button');btn.textContent='この評価を登録';btn.onclick=async()=>{try{if(!$('pid').value.trim())throw Error('匿名IDを入力してください');await post({kind:'rating',class_code:$('cl').value,participant_code:$('pid').value.trim(),stimulus_id:s.id,rating:Number(sel.value)});btn.textContent='保存しました';btn.disabled=true}catch(e){alert(e.message)}};div.append(head,p,sel,btn);$('stimuli').append(div)}}
</script><script>
const formIds=['cl','pid','grp','model','cond','trial','answers','statement'];
function draftSave(){try{localStorage.setItem('ai-personality-draft',JSON.stringify(Object.fromEntries(formIds.map(id=>[id,$(id).value]))));$('draftstatus').textContent='入力内容：端末に自動保存済み（サーバーへの送信とは別）';}catch(e){$('draftstatus').textContent='端末への自動保存に失敗しました';}}
try{const d=JSON.parse(localStorage.getItem('ai-personality-draft')||'null');if(d)for(const id of formIds){if(d[id]!==undefined)$(id).value=d[id];}update();}catch(e){}
let autoTimer;
for(const id of formIds){$(id).addEventListener('input',()=>{draftSave();clearTimeout(autoTimer);autoTimer=setTimeout(autoSubmit,1600)});$(id).addEventListener('change',()=>{draftSave();clearTimeout(autoTimer);autoTimer=setTimeout(autoSubmit,1600)})}
let sending=false;
function complete(){let a=$('answers').value.trim().split(/[^0-9]+/).filter(Boolean).map(Number);return /^[A-Za-z0-9_-]{3,24}$/.test($('pid').value.trim())&&/^[A-Za-z0-9_-]{1,12}$/.test($('grp').value.trim())&&$('model').value.trim().length>=2&&a.length===10&&a.every(v=>Number.isInteger(v)&&v>=1&&v<=5)&&$('statement').value.trim().length>=5;}
async function autoSubmit(){if(sending||!complete())return;sending=true;try{await submitTrial();draftSave();}finally{sending=false;}}
async function retryPending(){const p=localStorage.getItem('ai-personality-pending');if(!p||sending)return;sending=true;try{await post(JSON.parse(p));localStorage.removeItem('ai-personality-pending');$('msg').textContent='再送成功：サーバー保存を確認しました';}catch(e){if(String(e.message).includes('登録済み')){localStorage.removeItem('ai-personality-pending');$('msg').textContent='同じ試行はサーバー登録済みです';}else $('msg').textContent='再送待機中：'+e.message;}finally{sending=false;}}
window.addEventListener('online',retryPending);window.addEventListener('focus',retryPending);setInterval(retryPending,15000);retryPending();
</script></html>

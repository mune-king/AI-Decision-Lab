<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Decision Lab — 体験版</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#223;margin:0}main{max-width:720px;margin:3rem auto;background:white;border-radius:18px;padding:2rem;box-shadow:0 4px 22px #0001}label{display:block;margin:1em 0 .3em;font-weight:600}input,select,button{width:100%;padding:12px;font:inherit;box-sizing:border-box;border-radius:8px;border:1px solid #bbc}button{background:#126691;color:white;border:0;margin-top:18px;cursor:pointer}.small{color:#667;font-size:.9rem}.warning{color:#ae2432;font-weight:600}.panel{background:#eaf3f8;padding:18px;border-radius:12px;margin:18px 0}.price{font-size:2.2em;font-weight:700}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:right}@media(max-width:600px){main{margin:0;padding:1rem;border-radius:0}}</style></head><body><main><h1>AI Decision Lab</h1><p>非線形意思決定実験 — 講義用 v0.2（CSV提出方式）</p><p class="warning">回答はサーバーに自動送信されません。終了後、CSVを保存してClassroomに提出してください。</p><section id="setup"><label>実験ID（教員指定の匿名番号・半角英数字）</label><input id="participant" type="text" maxlength="24" placeholder="例：S001" autocomplete="off"><p class="small">氏名・学籍番号は入力しないでください。授業開始時に指定された実験IDを使用します。</p><label>市場環境</label><select id="condition"><option value="A">A：上昇</option><option value="B">B：レンジ</option><option value="C">C：緩やかな下落</option><option value="D">D：急落</option><option value="E">E：金融恐慌</option></select><label>制約</label><select id="mode"><option value="restricted">100株上限、追加資金なし</option><option value="unrestricted">株数上限なし、追加資金あり</option></select><button id="start">実験を開始</button></section><section id="game" hidden><div class="panel"><div id="step"></div><div id="price" class="price"></div><div id="status"></div></div><label>取引後の保有株数（整数）</label><input id="shares" type="number" min="0" step="1"><div id="fundbox" hidden><label>今回の追加投入額（円）</label><input id="funds" type="number" min="0" step="1" value="0"></div><p id="error" class="warning" aria-live="polite"></p><button id="next">判断を確定して次へ</button></section><section id="done" hidden><h2>実験完了</h2><p id="summary"></p><p class="warning">必ず「結果CSVをダウンロード」し、Classroomに提出してください。保存するだけでは教員には届きません。</p><button id="download">結果CSVをダウンロード</button><button id="again">もう一度</button><div style="overflow-x:auto"><table><thead><tr><th>段階</th><th>価格</th><th>株数</th><th>現金</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const P=[1000,950,900,850,800,750,700,650,600,650,700,750,800,850,900,950,1000],$=s=>document.getElementById(s);let i=0,n=100,c=0,a=0,mode='',cond='',participant='',data=[];
const storageKey='ai_decision_lab_class_v02';
function show(){ $('step').textContent=`段階 ${i+1} / 17`; $('price').textContent=P[i].toLocaleString()+' 円';$('status').textContent=`保有 ${n}株・現金 ${c.toLocaleString()}円`; $('shares').value=n;$('funds').value=0;$('error').textContent='';}
$('start').onclick=()=>{const id=$('participant').value.trim().toUpperCase();if(!/^[A-Z0-9_-]{2,24}$/.test(id)){alert('匿名実験IDを半角英数字で入力してください（例：S001）');return;}participant=id; if(localStorage.getItem(storageKey)&&!confirm('前の回答記録が残っています。新しい実験を開始すると、この端末の前回記録は上書きされます。続けますか？'))return; i=0;n=100;c=0;a=0;data=[];mode=$('mode').value;cond=$('condition').value;$('fundbox').hidden=mode==='restricted';$('setup').hidden=true;$('done').hidden=true;$('game').hidden=false;show();saveProgress()};
$('next').onclick=()=>{let raw=$('shares').value, v=Number(raw),f=Number($('funds').value);if(raw===''||!Number.isSafeInteger(v)||v<0||(mode==='restricted'&&v>100)){ $('error').textContent='保有株数を整数で入力してください。';return;}if(!Number.isSafeInteger(f)||f<0||(mode==='restricted'&&f!==0)){ $('error').textContent='追加資金は0以上の整数にしてください。';return;}const balance=c+f+(n-v)*P[i];if(!Number.isSafeInteger(balance)||balance<0){$('error').textContent='現金不足です。株数や追加資金を見直してください。';return;}c=balance;a+=f;n=v;data.push([participant,cond,mode,i+1,P[i],n,c,a,new Date().toISOString()]);i++;saveProgress();if(i<17){show();return;}$('game').hidden=true;$('done').hidden=false;$('summary').textContent=`最終保有${n}株、現金${c.toLocaleString()}円、追加資金${a.toLocaleString()}円、純損益${(c+n*1000-100000-a).toLocaleString()}円`;$('rows').replaceChildren();for(const r of data){let tr=document.createElement('tr');for(const x of [r[3],r[4],r[5],r[6]]){let td=document.createElement('td');td.textContent=x;tr.append(td)}$('rows').append(tr)}};
$('download').onclick=()=>{const s='participant_code,condition,mode,step,price,shares,cash_balance,cumulative_added_funds,answered_at_utc\r\n'+data.map(x=>x.join(',')).join('\r\n');const u=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}));let link=document.createElement('a');link.href=u;link.download='AI-Decision-Lab_'+participant+'_'+cond+'_'+mode+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('again').onclick=()=>{$('done').hidden=true;$('setup').hidden=false};
function saveProgress(){try{localStorage.setItem(storageKey,JSON.stringify({i,n,c,a,mode,cond,participant,data}))}catch(e){console.warn('Local progress backup unavailable')}}
function restore(){try{const raw=localStorage.getItem(storageKey);if(!raw)return;const x=JSON.parse(raw);if(!x||!Array.isArray(x.data)||x.i<0||x.i>17)return;({i,n,c,a,mode,cond,participant,data}=x);$('participant').value=participant;$('mode').value=mode;$('condition').value=cond;$('fundbox').hidden=mode==='restricted';if(i>=17){$('setup').hidden=true;$('done').hidden=false;$('summary').textContent='前回の回答が完了しています。CSVをダウンロードしてClassroomへ提出してください。';return;}if(confirm('この端末に途中回答（'+i+'/17段階）が見つかりました。続きから再開しますか？')){$('setup').hidden=true;$('game').hidden=false;show()}}catch(e){console.warn('Restoration failed')}}restore();
</script></body></html>

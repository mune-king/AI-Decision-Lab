<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10月20日 判断アンケート</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:auto;padding:20px}input,select,button{font-size:18px;padding:8px;margin:5px;width:95%}section{border:1px solid #ccc;padding:12px;margin:12px 0;border-radius:8px}button{background:#16466e;color:white;border:0}</style><h2>価格予測アンケート（10月20日）</h2><p>同じ学籍番号で討論前・討論後の2回、回答してください。送信先サーバーは未接続です。回答完了後、CSVを保存してください。</p><label>学籍番号（半角数字）<input id="id" autocomplete="off"></label><label>回答時点<select id="phase"><option value="">選択</option><option value="pre">討論前</option><option value="post">討論後</option></select></label><div id="questions"></div><label>班での討論により考えたこと<input id="remark" placeholder="討論後のみでも可"></label><button id="save">回答CSVを保存</button><p id="status" role="status"></p><script>const letters=['A','B','C','D','E','F'];const qs=document.getElementById('questions');qs.innerHTML=letters.map(k=>'<section><b>系列'+k+'</b><label>予測<select id="p'+k+'"><option value="">選択</option><option value="up">上がる</option><option value="down">下がる</option><option value="unknown">判断保留</option></select></label><label>自信度 0〜100<input type="number" id="c'+k+'" min="0" max="100" placeholder="50"></label><label>判断の根拠<input id="r'+k+'"></label></section>').join('');document.getElementById('phase').value=new URLSearchParams(location.search).get('phase')||'';document.getElementById('save').onclick=()=>{const id=document.getElementById('id').value.trim(),phase=document.getElementById('phase').value;if(!/^[0-9]{5,12}$/.test(id)||!['pre','post'].includes(phase)){document.getElementById('status').textContent='学籍番号（半角数字5〜12桁）と回答時点を確認してください';return}const data={event:'20261020',student_number:id,phase,created_at:new Date().toISOString()};for(const k of letters){const p=document.getElementById('p'+k).value,c=document.getElementById('c'+k).value,r=document.getElementById('r'+k).value;if(!p||c===''||Number(c)<0||Number(c)>100){document.getElementById('status').textContent='系列'+k+'の予測・自信度を確認してください';return}data[k+'_prediction']=p;data[k+'_confidence']=c;data[k+'_reason']=r}data.remark=document.getElementById('remark').value;const esc=x=>'"'+String(x??'').replaceAll('"','""')+'"';const csv='\ufeff'+Object.keys(data).map(esc).join(',')+'\r\n'+Object.values(data).map(esc).join(',');const a=document.createElement('a');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=id+'_20261020_'+phase+'.csv';a.click();document.getElementById('status').textContent='CSVを保存しました。サーバーには送信されません。';setTimeout(()=>URL.revokeObjectURL(url),2000)};</script></html>

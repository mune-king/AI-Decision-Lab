<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10月20日 判断アンケート</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:auto;padding:20px}input,select,button{font-size:18px;padding:8px;margin:5px;width:95%}section{border:1px solid #ccc;padding:12px;margin:12px 0;border-radius:8px}button{background:#16466e;color:white;border:0}</style><h2>価格予測アンケート（10月20日）</h2><p>同じ学籍番号で討論前・討論後の2回、回答してください。回答はサーバーへ送信されます。保存完了の表示を確認してください。</p><label>学籍番号（半角英数字）<input id="id" autocomplete="off"></label><p id="phaseLabel" style="font-weight:bold;padding:10px;background:#eef3f8"></p><div id="questions"></div><section id="discussion" style="display:none"><h3>班での討論を振り返る</h3><label>討論の結果、予測が変わりましたか？<select id="changed"><option value="">選択してください</option><option value="yes">変わった</option><option value="no">変わらなかった</option></select></label><div id="changeDetails" style="display:none"><label>予測が変わった系列（代表1つ）<select id="changedSeries"><option value="">選択</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select></label><label>判断が変わった主な理由<select id="influence"><option value="">選択</option><option value="reason">他の人の説明や根拠に納得した</option><option value="majority">多数意見の影響を受けた</option><option value="confidence">自信のある人の発言に影響された</option><option value="self">自分で考え直した</option><option value="other">その他</option></select></label></div><label id="reflectionLabel" style="display:none">班討論を通じて気づいたこと（自由記述・任意）<input id="remark" placeholder="例：私は最後の値動きだけに注目していた"></label></section><button id="save">サーバーへ送信</button><p id="status" role="status"></p><script>const letters=['A','B','C','D','E','F'];const qs=document.getElementById('questions');qs.innerHTML=letters.map(k=>'<section><b>系列'+k+'</b><label>予測<select id="p'+k+'"><option value="">選択</option><option value="up">上がる</option><option value="down">下がる</option><option value="unknown">判断保留</option></select></label><label>自信度 0〜100<input type="number" id="c'+k+'" min="0" max="100" placeholder="50"></label><label>判断の根拠<input id="r'+k+'"></label></section>').join('');const phaseFromQR=new URLSearchParams(location.search).get('phase');const validPhase=['pre','post'].includes(phaseFromQR);document.getElementById('phaseLabel').textContent=validPhase?(phaseFromQR==='pre'?'討論前アンケート':'討論後アンケート'):'回答するQRコードが正しくありません。授業のQRコードから開いてください。';document.getElementById('discussion').style.display=phaseFromQR==='post'?'block':'none';document.getElementById('changed').addEventListener('change',()=>{const v=document.getElementById('changed').value;document.getElementById('changeDetails').style.display=v==='yes'?'block':'none';document.getElementById('reflectionLabel').style.display=v?'block':'none';});const SUPABASE_URL='https://plirzczxdhddfcxldnxj.supabase.co';const SUPABASE_KEY='sb_publishable_NCH7QuER6v_83QHr8RvVkA_9U2oprUz';document.getElementById('save').textContent='サーバーへ送信';let submitting=false;
document.getElementById('save').onclick=async()=>{if(submitting)return;const id=document.getElementById('id').value.trim(),phase=phaseFromQR,status=document.getElementById('status'),button=document.getElementById('save');if(!/^[A-Za-z0-9]{5,20}$/.test(id)){status.textContent='学籍番号は半角英数字5〜20文字で入力してください（例：m95018）';return}if(!['pre','post'].includes(phase)){status.textContent='QRの回答時点が不明です。討論前・討論後の専用リンクから開いてください';return}
const predictions={},confidence={},reasoning={};for(const k of letters){const p=document.getElementById('p'+k).value,c=document.getElementById('c'+k).value,r=document.getElementById('r'+k).value.trim();if(!p||c===''||!Number.isFinite(Number(c))||Number(c)<0||Number(c)>100){status.textContent='系列'+k+'の予測・自信度を確認してください';return}predictions[k]=p;confidence[k]=Number(c);reasoning[k]=r;}
let discussion='';if(phase==='post'){const ch=document.getElementById('changed').value;if(!ch){status.textContent='討論によって予測が変わったかを選んでください';return}let series='',influence='';if(ch==='yes'){series=document.getElementById('changedSeries').value;influence=document.getElementById('influence').value;if(!series||!influence){status.textContent='変わった系列と理由を選んでください';return}}discussion=JSON.stringify({changed:ch,changed_series:series,influence,reflection:document.getElementById('remark').value});}
const payload={event_code:'20261020',participant_code:id,phase,predictions,confidence,reasoning,discussion_reason:discussion};
submitting=true;button.disabled=true;status.textContent='サーバーへ送信しています…';
try{const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),15000);let res;try{res=await fetch(SUPABASE_URL+'/rest/v1/classroom_survey_20261020',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload),signal:ctrl.signal});}finally{clearTimeout(timeout)}
if(!res.ok){const details=await res.text();if(res.status===409){status.textContent='この学籍番号の同じ回の回答は既に保存済みです。重複送信は不要です。';return;}throw new Error('HTTP '+res.status+' '+details.slice(0,180))}
status.textContent='サーバー保存完了：'+id+' ／ '+(phase==='pre'?'討論前':'討論後')+'。この画面を閉じて大丈夫です。';button.textContent='送信済み';button.disabled=true;return;
}catch(error){console.error(error);status.textContent='サーバー保存に失敗しました。通信状況を確認して再送してください。回答はこの画面に残っています。';}finally{submitting=false;if(button.textContent!=='送信済み')button.disabled=false;}};</script></html>
